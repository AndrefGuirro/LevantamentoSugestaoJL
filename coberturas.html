<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metas de Cobertura</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body class="coberturas-page">
  <div id="header-container"></div>

  <main class="container py-3 mb-5">
    <div class="row g-3">
      <aside class="col-12 col-md-4">
        <div class="card bg-secondary text-light shadow-sm border-0">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="card-title mb-0">Listas de Positivações</h5>
              <button id="toggleListsBtn" class="btn btn-sm btn-outline-light" aria-label="Recolher listas">
                <i class="bi bi-chevron-up"></i>
              </button>
            </div>

            <div id="listsContent">
              <form id="newListForm" class="mb-2" autocomplete="off">
                <div class="input-group">
                  <input id="newListTitle" class="form-control" placeholder="Nome de nova lista" required>
                  <button class="btn btn-success" type="submit">Criar</button>
                </div>
              </form>

              <ul id="listsContainer" class="list-group list-group-flush"></ul>
            </div>
          </div>
        </div>
      </aside>

      <section class="col-12 col-md-8">
        <div class="card bg-dark border-secondary text-light shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div>
                <h5 id="selectedListTitle" class="mb-0">Selecione ou crie uma lista</h5>
                <input id="editTitleInput" class="form-control form-control-sm d-none" />
              </div>
              <div class="btn-group">
                <button id="renameListBtn" class="btn btn-outline-light btn-sm">Editar título</button>
                <button id="deleteListBtn" class="btn btn-outline-danger btn-sm">Excluir lista</button>
              </div>
            </div>

            <form id="newItemForm" class="mb-3" autocomplete="off">
              <div class="input-group">
                <input id="newItemText" class="form-control" placeholder="Adicionar meta..." required>
                <button class="btn btn-primary" type="submit">Adicionar</button>
              </div>
            </form>

            <div id="itemsArea">
              <ul id="itemsList" class="list-group mb-3"></ul>

              <h6 class="mt-3">Concluídos</h6>
              <ul id="completedList" class="list-group mb-2"></ul>
            </div>

            <div id="noListSelected" class="text-center text-muted mt-4">
              Nenhuma lista selecionada
            </div>

            <div class="d-flex gap-2 mt-3">
              <button id="clearCompletedBtn" class="btn btn-outline-danger btn-sm">Excluir concluídos</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="coberturas.js"></script>
</body>
</html>
