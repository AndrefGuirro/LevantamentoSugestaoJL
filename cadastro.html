<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Container do cabeçalho (Carregado via JavaScript) -->
    <div id="header-container"></div>

    <!-- Conteúdo principal -->
    <div class="container mt-3">
        <h2>Cadastro de Produtos</h2>
        <form id="formCadastro">
            <div class="mb-3">
                <label for="nomeProduto" class="form-label">Nome do Produto</label>
                <input type="text" class="form-control" id="nomeProduto" required>
            </div>
            <div class="mb-3">
                <label for="grupoProduto" class="form-label">Grupo do Produto</label>
                <select class="form-select" id="grupoProduto" required>
                    <option value="">Selecione um grupo</option>
                    <option value="AB MAURI">AB MAURI</option>
                    <option value="DADINHO">DADINHO</option>
                    <option value="PECCIN SA">PECCIN SA</option>
                    <option value="NUTRATA">NUTRATA</option>
                    <option value="HYPERA">HYPERA</option>
                    <option value="DORI ALIMENTOS">DORI ALIMENTOS</option>
                    <option value="VITAO ALIMENTOS">VITAO ALIMENTOS</option>
                    <option value="BASTON">BASTON</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Adicionar Produto</button>
        </form>

        <table id="tabelaProdutos" class="table mt-3">
            <thead>
                <tr>
                    <th>Nome do Produto</th>
                    <th>Grupo</th>
                </tr>
            </thead>
            <tbody>
                <!-- Produtos serão adicionados aqui dinamicamente -->
            </tbody>
        </table>
    </div>

    <!-- Container do rodapé (Carregado via JavaScript) -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cadastro.js"></script>
</body>
</html>
