<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levantamento de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.5.0/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/x-icon" href="/Imagens/logoMarcas144x144.png">    
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!-- Container do cabeçalho (Carregado via JavaScript) -->
    <div id="header-container"></div>

    <!-- Tabela de Levantamento de Estoque -->
    <div class="container mt-3">
        <!-- Cabeçalho "Levantamento de Estoque" e botões fixos -->
        <div class="sticky-header">
            <h2>Levantamento de Estoque</h2>

            <div class="filter-controls mb-3">
                <div class="status-filter-group">
                    <button id="btnApenasCadastrados" type="button" class="btn btn-outline-secondary btn-sm">Apenas Cadastrados</button>
                    <button id="btnTodosProdutos" type="button" class="btn btn-outline-secondary btn-sm active">Todos Produtos</button>
                </div>

                <div class="group-filter-box">
                    <label for="grupoProduto" class="form-label mb-1">Grupo do Produto</label>
                    <select class="form-select form-select-sm" id="grupoProduto" required>
                        <option value="">Todos Produtos</option>
                        <option value="AB MAURI">AB MAURI</option>
                        <option value="DADINHO">DADINHO</option>
                        <option value="PECCIN SA">PECCIN SA</option>
                        <option value="NUTRATA">NUTRATA</option>
                        <option value="HYPERA">HYPERA</option>
                        <option value="DORI ALIMENTOS">DORI ALIMENTOS</option>
                        <option value="LINDT">LINDT</option>
                        <option value="VITAO ALIMENTOS">VITAO ALIMENTOS</option>
                        <option value="BASTON">BASTON</option>
                        <option value="PERFETTI VAN MELLE">PERFETTI VAN MELLE</option>
                        <option value="VAPZA">VAPZA</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Campo de pesquisa -->
        <div class="input-group mb-3">
            <input type="text" class="form-control" id="searchInput" placeholder="Digite o nome do produto">
            <span class="input-group-text">
                <i class="bi bi-search"></i> <!-- Ícone de lupa -->
            </span>
        </div>

        <div class="d-flex align-items-center gap-4">
            <div class="shareButton">
                <button id="shareButton" class="btn" type="button" aria-label="Compartilhar via WhatsApp">
                    <svg id="shareImage" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                        <path fill="#1BD741" style="filter: drop-shadow(0 0 1px rgba(0,0,0,0.25));" d="M16 3.2C8.8 3.2 2.9 8.9 2.9 16.1c0 2.7.8 5.3 2.3 7.5L3.2 29l5.6-2.1c2.1 1.2 4.6 1.8 7.2 1.8 7.2 0 13.1-5.7 13.1-12.9S23.2 3.2 16 3.2zm0 21.4c-1.9 0-3.8-.5-5.4-1.4l-.4-.2-3.3 1.2 1.1-3.2-.3-.4A9.6 9.6 0 0 1 6.3 16c0-5.3 4.7-9.6 10.7-9.6s10.7 4.3 10.7 9.6-4.7 9.6-10.7 9.6zm5.9-7.2c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.7-1.7-2.1-.2-.4 0-.6.1-.8.1-.2.3-.4.4-.6.1-.2.2-.3.3-.5.1-.2.1-.4 0-.5-.1-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.7.4-.3.3-1 1-.1 2.6 1 1.5 2 2.8 3.1 3.7 1.3 1.1 2.7 1.5 3.6 1.7.6.1 1.1.1 1.5-.1.4-.2 1.3-.9 1.5-1.6.2-.7.2-1.2.1-1.4-.1-.2-.3-.2-.6-.4z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Tabela de produtos -->
        <table class="table table-striped table-bordered">
            <thead class="custom-table-header">
                <tr>
                    <th>NOME PRODUTO</th>
                    <th>ESTOQUE</th>
                    <th>SUGESTÃO</th>
                </tr>
            </thead>
            <tbody id="tabelaProdutos">
                <!-- Produtos serão carregados aqui dinamicamente no futuro -->
            </tbody>
        </table>
    </div>

    <!-- Container do rodapé (Carregado via JavaScript) -->
    <div id="footer-container"></div> 
    
    <!-- Registrar Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(() => console.log('Service Worker registrado com sucesso!'))
                    .catch((error) => console.error('Falha ao registrar o Service Worker:', error));
            });
        }
    </script>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="levantamento.js"></script>
</body>
</html>
